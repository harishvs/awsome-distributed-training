# Install NVIDIA GPU drivers for CentOS 9
# Requirement 3.1: Install NVIDIA GPU drivers compatible with CentOS 9
# Uses DNF module streams which is the proper method for RHEL 9/CentOS Stream 9
---
- name: "Install NVIDIA driver dependencies"
  ansible.builtin.dnf:
    name: "{{ nvidia_driver_dependencies }}"
    state: present
  become: true

- name: "Download NVIDIA CUDA repository file"
  ansible.builtin.get_url:
    url: "{{ nvidia_cuda_repo_url }}"
    dest: /etc/yum.repos.d/cuda-rhel9.repo
    mode: '0644'
  become: true

- name: "Update DNF cache after adding NVIDIA repository"
  ansible.builtin.dnf:
    update_cache: true
  become: true

- name: "Install NVIDIA driver using module stream"
  ansible.builtin.command:
    cmd: "dnf module install -y nvidia-driver:{{ nvidia_driver_module_stream }}"
  become: true
  register: nvidia_install
  changed_when: "'Installing' in nvidia_install.stdout or 'Upgrading' in nvidia_install.stdout"

- name: "Verify NVIDIA driver module is available"
  ansible.builtin.shell: |
    modinfo nvidia || echo "Module will be available after reboot"
  register: nvidia_modinfo
  changed_when: false
  failed_when: false
  become: true

- name: "Display NVIDIA driver installation status"
  ansible.builtin.debug:
    msg: "NVIDIA driver (stream: {{ nvidia_driver_module_stream }}) installed. Kernel module status: {{ nvidia_modinfo.stdout_lines | default(['Not yet loaded']) }}"
