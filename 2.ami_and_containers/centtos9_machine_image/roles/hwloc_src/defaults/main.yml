# hwloc configuration for CentOS 9
# Requirement 7.1: Download hwloc release version source
# Requirement 7.2: Build hwloc with standard configuration
# Requirement 7.3: Install hwloc to /opt/hwloc prefix
# Requirement 7.4: Configure hwloc environment variables in /etc/profile.d/
---
# hwloc version to build
# Configured in group_vars/all.yml
hwloc_version: "{{ hwloc_version | default('2.10.0') }}"

# hwloc download URL
# Requirement 7.1: Download hwloc release version source
hwloc_download_url: "https://download.open-mpi.org/release/hwloc/v2.10/hwloc-{{ hwloc_version }}.tar.gz"

# Build directory for hwloc source
hwloc_build_dir: "{{ work_dir | default('/tmp') }}/hwloc"

# Installation prefix for hwloc
# Requirement 7.3: Install hwloc to /opt/hwloc prefix
hwloc_install_prefix: "{{ hwloc_prefix | default('/opt/hwloc') }}"

# Profile script for environment variables
# Requirement 7.4: Configure hwloc environment variables in /etc/profile.d/
hwloc_profile_script: "/etc/profile.d/hwloc.sh"
